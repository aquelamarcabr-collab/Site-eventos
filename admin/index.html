<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — G.R. Master</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div class="admin-topbar">
  <div class="container">
    <img src="../assets/logo-white.svg" alt="G.R. Master Eventos & Consultoria">
    <div class="who">
      <strong id="user-email">...</strong>
      <a href="../index.html" class="btn btn-outline btn-sm">Ver site</a>
      <button class="btn btn-primary btn-sm" id="logout-btn">Sair</button>
    </div>
  </div>
</div>

<main class="admin-main">
  <div class="container">

    <div class="admin-tabs">
      <button class="admin-tab-btn active" data-tab="leads">Orçamentos</button>
      <button class="admin-tab-btn" data-tab="posts">Blog</button>
      <button class="admin-tab-btn" data-tab="works">Trabalhos</button>
      <button class="admin-tab-btn" data-tab="testimonials">Depoimentos</button>
    </div>

    <!-- ORÇAMENTOS -->
    <section class="admin-panel active" id="panel-leads">
      <div class="admin-toolbar">
        <h2>Pedidos de orçamento</h2>
        <button class="icon-btn" id="refresh-leads">Atualizar</button>
      </div>
      <div class="admin-card-list" id="leads-list">
        <p class="spinner-text">Carregando...</p>
      </div>
    </section>

    <!-- BLOG -->
    <section class="admin-panel" id="panel-posts">
      <div class="admin-toolbar">
        <h2>Publicações do blog</h2>
        <button class="btn btn-primary btn-sm" id="new-post-btn">+ Novo post</button>
      </div>
      <div class="admin-card-list" id="posts-list">
        <p class="spinner-text">Carregando...</p>
      </div>
    </section>

    <!-- TRABALHOS -->
    <section class="admin-panel" id="panel-works">
      <div class="admin-toolbar">
        <h2>Trabalhos (fotos e vídeos)</h2>
        <button class="btn btn-primary btn-sm" id="new-work-btn">+ Novo trabalho</button>
      </div>
      <div class="admin-card-list" id="works-list">
        <p class="spinner-text">Carregando...</p>
      </div>
    </section>

    <!-- DEPOIMENTOS -->
    <section class="admin-panel" id="panel-testimonials">
      <div class="admin-toolbar">
        <h2>Depoimentos de clientes</h2>
        <button class="btn btn-primary btn-sm" id="new-testimonial-btn">+ Novo depoimento</button>
      </div>
      <div class="admin-card-list" id="testimonials-list">
        <p class="spinner-text">Carregando...</p>
      </div>
    </section>

  </div>
</main>

<!-- Modal editor de post -->
<div class="modal-overlay" id="post-modal">
  <div class="modal-box">
    <h2 id="modal-title">Novo post</h2>
    <form id="post-form">
      <input type="hidden" id="post-id">
      <div class="field">
        <label for="post-title-input">Título *</label>
        <input type="text" id="post-title-input" required>
      </div>
      <div class="field">
        <label for="post-slug">Slug (URL) *</label>
        <input type="text" id="post-slug" required pattern="[a-z0-9\-]+" title="Apenas letras minúsculas, números e hífens">
      </div>
      <div class="form-row">
        <div class="field">
          <label for="post-category">Categoria</label>
          <input type="text" id="post-category" value="Geral">
        </div>
        <div class="field">
          <label for="post-emoji">Emoji de capa</label>
          <input type="text" id="post-emoji" value="📰" maxlength="4">
        </div>
      </div>
      <div class="field">
        <label for="post-excerpt">Resumo (aparece no card)</label>
        <textarea id="post-excerpt" style="min-height:70px;"></textarea>
      </div>
      <div class="field">
        <label for="post-content">Conteúdo completo</label>
        <textarea id="post-content" style="min-height:220px;" placeholder="Separe os parágrafos com uma linha em branco."></textarea>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="post-published">
        <label for="post-published" style="margin:0;">Publicar (visível no site)</label>
      </div>
      <div class="admin-error" id="post-error"></div>
      <div class="modal-actions">
        <button type="button" class="icon-btn" id="cancel-post-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="save-post-btn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal editor de trabalho -->
<div class="modal-overlay" id="work-modal">
  <div class="modal-box">
    <h2 id="work-modal-title">Novo trabalho</h2>
    <form id="work-form">
      <input type="hidden" id="work-id">
      <div class="field">
        <label for="work-title">Título *</label>
        <input type="text" id="work-title" required placeholder="Ex: Convenção Empresarial XP 2026">
      </div>
      <div class="form-row">
        <div class="field">
          <label for="work-category">Categoria</label>
          <select id="work-category">
            <option value="corporativo">Corporativo</option>
            <option value="social">Social</option>
            <option value="cultural">Cultural</option>
            <option value="feira">Feiras &amp; Congressos</option>
            <option value="show">Shows &amp; Festivais</option>
          </select>
        </div>
        <div class="field">
          <label for="work-type">Tipo</label>
          <select id="work-type">
            <option value="foto">Foto</option>
            <option value="video">Vídeo</option>
          </select>
        </div>
      </div>
      <div class="field" id="work-image-field">
        <label for="work-image-file">Foto</label>
        <input type="file" id="work-image-file" accept="image/*">
        <img id="work-image-preview" style="display:none;max-width:100%;border-radius:10px;margin-top:10px;">
      </div>
      <div class="field" id="work-video-field" style="display:none;">
        <label for="work-video-url">Link do vídeo (YouTube, Instagram etc.)</label>
        <input type="url" id="work-video-url" placeholder="https://youtube.com/watch?v=...">
      </div>
      <div class="field">
        <label for="work-description">Descrição (opcional)</label>
        <textarea id="work-description" style="min-height:70px;"></textarea>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="work-published">
        <label for="work-published" style="margin:0;">Publicar (visível no Portfólio do site)</label>
      </div>
      <div class="admin-error" id="work-error"></div>
      <div class="modal-actions">
        <button type="button" class="icon-btn" id="cancel-work-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="save-work-btn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal editor de depoimento -->
<div class="modal-overlay" id="testimonial-modal">
  <div class="modal-box">
    <h2 id="testimonial-modal-title">Novo depoimento</h2>
    <form id="testimonial-form">
      <input type="hidden" id="testimonial-id">
      <div class="form-row">
        <div class="field">
          <label for="testimonial-name">Nome do cliente *</label>
          <input type="text" id="testimonial-name" required>
        </div>
        <div class="field">
          <label for="testimonial-role">Cargo / Empresa</label>
          <input type="text" id="testimonial-role" placeholder="Ex: Diretora de Eventos, Empresa XP">
        </div>
      </div>
      <div class="field">
        <label for="testimonial-quote">Depoimento *</label>
        <textarea id="testimonial-quote" required style="min-height:100px;" placeholder="O que o cliente disse sobre o trabalho da G.R. Master"></textarea>
      </div>
      <div class="field">
        <label for="testimonial-photo-file">Foto do cliente (opcional)</label>
        <input type="file" id="testimonial-photo-file" accept="image/*">
        <img id="testimonial-photo-preview" style="display:none;width:64px;height:64px;object-fit:cover;border-radius:50%;margin-top:10px;">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="testimonial-published">
        <label for="testimonial-published" style="margin:0;">Publicar (visível no site)</label>
      </div>
      <div class="admin-error" id="testimonial-error"></div>
      <div class="modal-actions">
        <button type="button" class="icon-btn" id="cancel-testimonial-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="save-testimonial-btn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  /* ---------- Auth guard ---------- */
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('user-email').textContent = session.user.email;
  }

  supabase.auth.onAuthStateChange((event, sess) => {
    if (!sess) window.location.href = 'login.html';
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  /* ---------- Tabs ---------- */
  document.querySelectorAll('.admin-tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.admin-tab-btn').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.admin-panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function formatDateTime(iso) {
    return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  /* ---------- Leads (orçamentos) ---------- */
  const leadsList = document.getElementById('leads-list');
  const statusLabels = { novo: 'Novo', em_contato: 'Em contato', fechado: 'Fechado' };

  async function loadLeads() {
    leadsList.innerHTML = '<p class="spinner-text">Carregando...</p>';
    const { data, error } = await supabase.from('contacts').select('*').order('created_at', { ascending: false });
    if (error) {
      leadsList.innerHTML = '<p class="spinner-text">Erro ao carregar: ' + escapeHtml(error.message) + '</p>';
      return;
    }
    if (!data || data.length === 0) {
      leadsList.innerHTML = '<div class="empty-state">Nenhum pedido de orçamento recebido ainda.</div>';
      return;
    }
    leadsList.innerHTML = data.map((lead) => `
      <div class="lead-card" data-id="${lead.id}">
        <div class="main">
          <h3>${escapeHtml(lead.nome)}</h3>
          <div class="meta-row">
            <a href="https://wa.me/55${(lead.telefone || '').replace(/\D/g,'')}" target="_blank" rel="noopener">📞 ${escapeHtml(lead.telefone)}</a>
            <a href="mailto:${escapeHtml(lead.email)}">✉️ ${escapeHtml(lead.email)}</a>
            ${lead.tipo_evento ? `<span>🎫 ${escapeHtml(lead.tipo_evento)}</span>` : ''}
            ${lead.data_evento ? `<span>📅 ${escapeHtml(lead.data_evento)}</span>` : ''}
            ${lead.convidados ? `<span>👥 ${escapeHtml(lead.convidados)} convidados</span>` : ''}
          </div>
          ${lead.mensagem ? `<div class="msg">${escapeHtml(lead.mensagem)}</div>` : ''}
        </div>
        <div class="side">
          <span class="lead-date">${formatDateTime(lead.created_at)}</span>
          <select data-id="${lead.id}" class="status-select">
            <option value="novo" ${lead.status === 'novo' ? 'selected' : ''}>Novo</option>
            <option value="em_contato" ${lead.status === 'em_contato' ? 'selected' : ''}>Em contato</option>
            <option value="fechado" ${lead.status === 'fechado' ? 'selected' : ''}>Fechado</option>
          </select>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.status-select').forEach((sel) => {
      sel.addEventListener('change', async () => {
        await supabase.from('contacts').update({ status: sel.value }).eq('id', sel.dataset.id);
      });
    });
  }

  document.getElementById('refresh-leads').addEventListener('click', loadLeads);
  loadLeads();

  /* ---------- Posts (blog) ---------- */
  const postsList = document.getElementById('posts-list');
  const modal = document.getElementById('post-modal');
  const postForm = document.getElementById('post-form');
  const postError = document.getElementById('post-error');

  async function loadPosts() {
    postsList.innerHTML = '<p class="spinner-text">Carregando...</p>';
    const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
    if (error) {
      postsList.innerHTML = '<p class="spinner-text">Erro ao carregar: ' + escapeHtml(error.message) + '</p>';
      return;
    }
    if (!data || data.length === 0) {
      postsList.innerHTML = '<div class="empty-state">Nenhum post cadastrado ainda. Clique em "+ Novo post" para começar.</div>';
      return;
    }
    postsList.innerHTML = data.map((post) => `
      <div class="post-row">
        <div class="emoji">${post.emoji || '📰'}</div>
        <div class="info">
          <h3>${escapeHtml(post.title)}</h3>
          <div class="meta">
            <span class="status-badge ${post.published ? 'status-fechado' : 'status-novo'}">${post.published ? 'Publicado' : 'Rascunho'}</span>
            &nbsp;·&nbsp; ${escapeHtml(post.category)} &nbsp;·&nbsp; ${formatDateTime(post.created_at)}
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" data-edit="${post.id}">Editar</button>
          <button class="icon-btn danger" data-delete="${post.id}">Excluir</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => openEditor(data.find((p) => p.id === btn.dataset.edit)));
    });
    document.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Tem certeza que deseja excluir este post?')) return;
        await supabase.from('posts').delete().eq('id', btn.dataset.delete);
        loadPosts();
      });
    });
  }

  function slugify(text) {
    return text.toString().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9\s-]/g, '').trim()
      .replace(/\s+/g, '-').replace(/-+/g, '-');
  }

  let editingId = null;
  let slugTouched = false;

  function openEditor(post) {
    postError.classList.remove('show');
    editingId = post ? post.id : null;
    slugTouched = !!post;
    document.getElementById('modal-title').textContent = post ? 'Editar post' : 'Novo post';
    document.getElementById('post-title-input').value = post ? post.title : '';
    document.getElementById('post-slug').value = post ? post.slug : '';
    document.getElementById('post-category').value = post ? post.category : 'Geral';
    document.getElementById('post-emoji').value = post ? post.emoji : '📰';
    document.getElementById('post-excerpt').value = post ? post.excerpt || '' : '';
    document.getElementById('post-content').value = post ? post.content || '' : '';
    document.getElementById('post-published').checked = post ? post.published : false;
    modal.classList.add('show');
  }

  document.getElementById('new-post-btn').addEventListener('click', () => openEditor(null));
  document.getElementById('cancel-post-btn').addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

  document.getElementById('post-title-input').addEventListener('input', (e) => {
    if (!slugTouched) document.getElementById('post-slug').value = slugify(e.target.value);
  });
  document.getElementById('post-slug').addEventListener('input', () => { slugTouched = true; });

  postForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    postError.classList.remove('show');
    const saveBtn = document.getElementById('save-post-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando...';

    const record = {
      title: document.getElementById('post-title-input').value.trim(),
      slug: slugify(document.getElementById('post-slug').value.trim()),
      category: document.getElementById('post-category').value.trim() || 'Geral',
      emoji: document.getElementById('post-emoji').value.trim() || '📰',
      excerpt: document.getElementById('post-excerpt').value.trim(),
      content: document.getElementById('post-content').value.trim(),
      published: document.getElementById('post-published').checked
    };

    let error;
    if (editingId) {
      ({ error } = await supabase.from('posts').update(record).eq('id', editingId));
    } else {
      ({ error } = await supabase.from('posts').insert(record));
    }

    saveBtn.disabled = false;
    saveBtn.textContent = 'Salvar';

    if (error) {
      postError.textContent = error.code === '23505'
        ? 'Já existe um post com esse slug. Escolha outro.'
        : 'Erro ao salvar: ' + error.message;
      postError.classList.add('show');
      return;
    }

    modal.classList.remove('show');
    loadPosts();
  });

  loadPosts();

  /* ---------- Trabalhos (portfólio) ---------- */
  const worksList = document.getElementById('works-list');
  const workModal = document.getElementById('work-modal');
  const workForm = document.getElementById('work-form');
  const workError = document.getElementById('work-error');
  const categoryLabels = { corporativo: 'Corporativo', social: 'Social', cultural: 'Cultural', feira: 'Feiras & Congressos', show: 'Shows & Festivais' };
  let editingWorkId = null;
  let workImageFile = null;
  let workImageUrl = null;

  async function uploadMedia(file, folder) {
    const ext = file.name.split('.').pop();
    const path = `${folder}/${crypto.randomUUID()}.${ext}`;
    const { error } = await supabase.storage.from('media').upload(path, file);
    if (error) throw error;
    const { data } = supabase.storage.from('media').getPublicUrl(path);
    return data.publicUrl;
  }

  async function loadWorks() {
    worksList.innerHTML = '<p class="spinner-text">Carregando...</p>';
    const { data, error } = await supabase.from('works').select('*').order('created_at', { ascending: false });
    if (error) {
      worksList.innerHTML = '<p class="spinner-text">Erro ao carregar: ' + escapeHtml(error.message) + '</p>';
      return;
    }
    if (!data || data.length === 0) {
      worksList.innerHTML = '<div class="empty-state">Nenhum trabalho cadastrado ainda. Clique em "+ Novo trabalho" para adicionar fotos ou vídeos.</div>';
      return;
    }
    worksList.innerHTML = data.map((w) => `
      <div class="post-row">
        <div class="emoji">${w.type === 'video' ? '🎬' : (w.image_url ? `<img src="${escapeHtml(w.image_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">` : '📷')}</div>
        <div class="info">
          <h3>${escapeHtml(w.title)}</h3>
          <div class="meta">
            <span class="status-badge ${w.published ? 'status-fechado' : 'status-novo'}">${w.published ? 'Publicado' : 'Rascunho'}</span>
            &nbsp;·&nbsp; ${escapeHtml(categoryLabels[w.category] || w.category)} &nbsp;·&nbsp; ${w.type === 'video' ? 'Vídeo' : 'Foto'}
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" data-edit-work="${w.id}">Editar</button>
          <button class="icon-btn danger" data-delete-work="${w.id}">Excluir</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('[data-edit-work]').forEach((btn) => {
      btn.addEventListener('click', () => openWorkEditor(data.find((w) => w.id === btn.dataset.editWork)));
    });
    document.querySelectorAll('[data-delete-work]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Tem certeza que deseja excluir este trabalho?')) return;
        await supabase.from('works').delete().eq('id', btn.dataset.deleteWork);
        loadWorks();
      });
    });
  }

  function toggleWorkTypeFields() {
    const isVideo = document.getElementById('work-type').value === 'video';
    document.getElementById('work-video-field').style.display = isVideo ? '' : 'none';
    document.getElementById('work-image-field').style.display = isVideo ? 'none' : '';
  }
  document.getElementById('work-type').addEventListener('change', toggleWorkTypeFields);

  function openWorkEditor(work) {
    workError.classList.remove('show');
    editingWorkId = work ? work.id : null;
    workImageFile = null;
    workImageUrl = work ? work.image_url : null;
    document.getElementById('work-modal-title').textContent = work ? 'Editar trabalho' : 'Novo trabalho';
    document.getElementById('work-title').value = work ? work.title : '';
    document.getElementById('work-category').value = work ? work.category : 'corporativo';
    document.getElementById('work-type').value = work ? work.type : 'foto';
    document.getElementById('work-video-url').value = work ? (work.video_url || '') : '';
    document.getElementById('work-description').value = work ? (work.description || '') : '';
    document.getElementById('work-published').checked = work ? work.published : false;
    document.getElementById('work-image-file').value = '';
    const preview = document.getElementById('work-image-preview');
    if (workImageUrl) { preview.src = workImageUrl; preview.style.display = ''; } else { preview.style.display = 'none'; }
    toggleWorkTypeFields();
    workModal.classList.add('show');
  }

  document.getElementById('work-image-file').addEventListener('change', (e) => {
    workImageFile = e.target.files[0] || null;
    if (workImageFile) {
      const preview = document.getElementById('work-image-preview');
      preview.src = URL.createObjectURL(workImageFile);
      preview.style.display = '';
    }
  });

  document.getElementById('new-work-btn').addEventListener('click', () => openWorkEditor(null));
  document.getElementById('cancel-work-btn').addEventListener('click', () => workModal.classList.remove('show'));
  workModal.addEventListener('click', (e) => { if (e.target === workModal) workModal.classList.remove('show'); });

  workForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    workError.classList.remove('show');
    const saveBtn = document.getElementById('save-work-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando...';

    try {
      const type = document.getElementById('work-type').value;
      let imageUrl = workImageUrl;
      if (type === 'foto' && workImageFile) {
        imageUrl = await uploadMedia(workImageFile, 'works');
      }

      const record = {
        title: document.getElementById('work-title').value.trim(),
        category: document.getElementById('work-category').value,
        type,
        image_url: type === 'foto' ? imageUrl : null,
        video_url: type === 'video' ? document.getElementById('work-video-url').value.trim() || null : null,
        description: document.getElementById('work-description').value.trim() || null,
        published: document.getElementById('work-published').checked
      };

      let error;
      if (editingWorkId) {
        ({ error } = await supabase.from('works').update(record).eq('id', editingWorkId));
      } else {
        ({ error } = await supabase.from('works').insert(record));
      }
      if (error) throw error;

      workModal.classList.remove('show');
      loadWorks();
    } catch (err) {
      workError.textContent = 'Erro ao salvar: ' + err.message;
      workError.classList.add('show');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar';
    }
  });

  loadWorks();

  /* ---------- Depoimentos ---------- */
  const testimonialsList = document.getElementById('testimonials-list');
  const testimonialModal = document.getElementById('testimonial-modal');
  const testimonialForm = document.getElementById('testimonial-form');
  const testimonialError = document.getElementById('testimonial-error');
  let editingTestimonialId = null;
  let testimonialPhotoFile = null;
  let testimonialPhotoUrl = null;

  async function loadTestimonials() {
    testimonialsList.innerHTML = '<p class="spinner-text">Carregando...</p>';
    const { data, error } = await supabase.from('testimonials').select('*').order('created_at', { ascending: false });
    if (error) {
      testimonialsList.innerHTML = '<p class="spinner-text">Erro ao carregar: ' + escapeHtml(error.message) + '</p>';
      return;
    }
    if (!data || data.length === 0) {
      testimonialsList.innerHTML = '<div class="empty-state">Nenhum depoimento cadastrado ainda. Clique em "+ Novo depoimento" para adicionar.</div>';
      return;
    }
    testimonialsList.innerHTML = data.map((t) => `
      <div class="post-row">
        <div class="emoji">${t.photo_url ? `<img src="${escapeHtml(t.photo_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : '💬'}</div>
        <div class="info">
          <h3>${escapeHtml(t.client_name)}</h3>
          <div class="meta">
            <span class="status-badge ${t.published ? 'status-fechado' : 'status-novo'}">${t.published ? 'Publicado' : 'Rascunho'}</span>
            ${t.client_role ? `&nbsp;·&nbsp; ${escapeHtml(t.client_role)}` : ''}
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" data-edit-testimonial="${t.id}">Editar</button>
          <button class="icon-btn danger" data-delete-testimonial="${t.id}">Excluir</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('[data-edit-testimonial]').forEach((btn) => {
      btn.addEventListener('click', () => openTestimonialEditor(data.find((t) => t.id === btn.dataset.editTestimonial)));
    });
    document.querySelectorAll('[data-delete-testimonial]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Tem certeza que deseja excluir este depoimento?')) return;
        await supabase.from('testimonials').delete().eq('id', btn.dataset.deleteTestimonial);
        loadTestimonials();
      });
    });
  }

  function openTestimonialEditor(testimonial) {
    testimonialError.classList.remove('show');
    editingTestimonialId = testimonial ? testimonial.id : null;
    testimonialPhotoFile = null;
    testimonialPhotoUrl = testimonial ? testimonial.photo_url : null;
    document.getElementById('testimonial-modal-title').textContent = testimonial ? 'Editar depoimento' : 'Novo depoimento';
    document.getElementById('testimonial-name').value = testimonial ? testimonial.client_name : '';
    document.getElementById('testimonial-role').value = testimonial ? (testimonial.client_role || '') : '';
    document.getElementById('testimonial-quote').value = testimonial ? testimonial.quote : '';
    document.getElementById('testimonial-published').checked = testimonial ? testimonial.published : false;
    document.getElementById('testimonial-photo-file').value = '';
    const preview = document.getElementById('testimonial-photo-preview');
    if (testimonialPhotoUrl) { preview.src = testimonialPhotoUrl; preview.style.display = ''; } else { preview.style.display = 'none'; }
    testimonialModal.classList.add('show');
  }

  document.getElementById('testimonial-photo-file').addEventListener('change', (e) => {
    testimonialPhotoFile = e.target.files[0] || null;
    if (testimonialPhotoFile) {
      const preview = document.getElementById('testimonial-photo-preview');
      preview.src = URL.createObjectURL(testimonialPhotoFile);
      preview.style.display = '';
    }
  });

  document.getElementById('new-testimonial-btn').addEventListener('click', () => openTestimonialEditor(null));
  document.getElementById('cancel-testimonial-btn').addEventListener('click', () => testimonialModal.classList.remove('show'));
  testimonialModal.addEventListener('click', (e) => { if (e.target === testimonialModal) testimonialModal.classList.remove('show'); });

  testimonialForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    testimonialError.classList.remove('show');
    const saveBtn = document.getElementById('save-testimonial-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando...';

    try {
      let photoUrl = testimonialPhotoUrl;
      if (testimonialPhotoFile) {
        photoUrl = await uploadMedia(testimonialPhotoFile, 'testimonials');
      }

      const record = {
        client_name: document.getElementById('testimonial-name').value.trim(),
        client_role: document.getElementById('testimonial-role').value.trim() || null,
        quote: document.getElementById('testimonial-quote').value.trim(),
        photo_url: photoUrl,
        published: document.getElementById('testimonial-published').checked
      };

      let error;
      if (editingTestimonialId) {
        ({ error } = await supabase.from('testimonials').update(record).eq('id', editingTestimonialId));
      } else {
        ({ error } = await supabase.from('testimonials').insert(record));
      }
      if (error) throw error;

      testimonialModal.classList.remove('show');
      loadTestimonials();
    } catch (err) {
      testimonialError.textContent = 'Erro ao salvar: ' + err.message;
      testimonialError.classList.add('show');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar';
    }
  });

  loadTestimonials();
</script>
</body>
</html>
