<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Painel Admin — G.R. Master</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <img src="../assets/logo.svg" alt="G.R. Master Eventos & Consultoria">
    <h1>Painel Administrativo</h1>
    <p class="sub">Faça login para gerenciar o blog e os pedidos de orçamento.</p>

    <div class="admin-error" id="error-box"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Entrar</button>
    </form>
    <p class="form-note mt-2"><a href="../index.html">&larr; Voltar ao site</a></p>
  </div>
</div>

<script type="module">
  import { supabase } from '../js/supabase.js';

  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');
  const form = document.getElementById('login-form');

  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'index.html';
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      console.error('Supabase auth error:', error);
      errorBox.textContent = 'Erro ao entrar: ' + error.message + ' (status ' + (error.status || '?') + ')';
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
      return;
    }

    window.location.href = 'index.html';
  });
</script>
</body>
</html>
